<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100%爱你老己 自爱指数测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== CLAYMORPHISM DESIGN SYSTEM powered by UI/UX Pro Max ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* Morandi Clay Palette */
  --c-bg: #faf8f5;
  --c-cream: #f5f2ed;
  --c-cream2: #edeae3;
  --c-text: #4a4040;
  --c-text2: #7a6e6e;
  --c-text3: #b0a4a4;
  --c-yellow: #e8d88a;
  --c-yellow-light: #f5f0d0;
  --c-green: #b8d8a8;
  --c-green-light: #ddf0d0;
  --c-blue: #a8c8d8;
  --c-blue-light: #d0e8f5;
  --c-pink: #e8b8c8;
  --c-pink-light: #f5d0e0;
  /* Claymorphism Tokens */
  --r-sm: 14px;
  --r-md: 22px;
  --r-lg: 28px;
  --r-xl: 36px;
  --border-w: 2.5px;
  --shadow-inner: inset -3px -3px 8px rgba(0,0,0,0.04);
  --shadow-outer: 4px 4px 12px rgba(0,0,0,0.06);
  --shadow-hover: 6px 6px 18px rgba(0,0,0,0.1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
}
html, body { height: 100%; font-family: "Nunito Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Helvetica, sans-serif; background: var(--c-bg); color: var(--c-text); overflow: hidden; -webkit-tap-highlight-color: transparent; }
/* ===== Floating Background Blobs ===== */
.bg-blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-blob { position: absolute; border-radius: 50%; opacity: 0.12; filter: blur(60px); animation: blobDrift 20s ease-in-out infinite; }
.bg-blob.y { background: var(--c-yellow); width: 200px; height: 200px; top: -60px; left: -40px; animation-delay: 0s; }
.bg-blob.g { background: var(--c-green); width: 240px; height: 240px; top: 40%; right: -80px; animation-delay: -5s; }
.bg-blob.b { background: var(--c-blue); width: 180px; height: 180px; bottom: -40px; left: 20%; animation-delay: -10s; }
.bg-blob.p { background: var(--c-pink); width: 220px; height: 220px; top: 20%; left: 60%; animation-delay: -15s; }
@keyframes blobDrift { 0%, 100% { transform: translate(0,0) scale(1); } 25% { transform: translate(30px,-20px) scale(1.08); } 50% { transform: translate(-15px,25px) scale(0.94); } 75% { transform: translate(-25px,-10px) scale(1.05); } }
/* ===== Screens ===== */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s var(--ease-soft), transform 0.5s var(--ease-soft); overflow-y: auto; padding: 24px 20px; z-index: 1; }
.screen.hidden { opacity: 0; pointer-events: none; transform: translateY(24px); }
.screen.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
/* ===== Home Screen ===== */
.home-inner { text-align: center; max-width: 380px; }
.home-emoji { font-size: 72px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.08)); }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.home-title { font-family: "Varela Round", "Nunito Sans", "PingFang SC", sans-serif; font-size: 36px; font-weight: 700; color: var(--c-text); line-height: 1.15; margin-bottom: 10px; letter-spacing: -0.5px; }
.home-sub { font-size: 16px; color: var(--c-text2); line-height: 1.7; margin-bottom: 36px; font-weight: 400; }
.home-btn { font-family: "Varela Round", "Nunito Sans", "PingFang SC", sans-serif; background: linear-gradient(135deg, var(--c-pink), var(--c-pink-light)); color: var(--c-text); border: var(--border-w) solid var(--c-pink); border-radius: var(--r-xl); padding: 18px 56px; font-size: 18px; font-weight: 700; cursor: pointer; transition: transform 0.2s var(--ease-bounce), box-shadow 0.2s var(--ease-soft); box-shadow: var(--shadow-inner), var(--shadow-outer); letter-spacing: 0.5px; -webkit-tap-highlight-color: transparent; user-select: none; }
.home-btn:active { transform: scale(0.94); box-shadow: inset -2px -2px 6px rgba(0,0,0,0.06); }
.home-tag { margin-top: 24px; font-size: 12px; color: var(--c-text3); letter-spacing: 1.5px; font-weight: 500; }
/* ===== Quiz Screen ===== */
.quiz-header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: rgba(250,248,245,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px 20px 8px; display: flex; align-items: center; gap: 12px; }
.quiz-progress { flex: 1; height: 8px; border-radius: 4px; background: var(--c-cream2); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.06); }
.quiz-progress-bar { height: 100%; border-radius: 4px; transition: width 0.5s var(--ease-soft); }
.quiz-counter { font-size: 14px; color: var(--c-text3); min-width: 52px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.quiz-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 70px 20px 20px; max-width: 420px; width: 100%; margin: 0 auto; }
.quiz-num { font-size: 13px; color: var(--c-text3); margin-bottom: 8px; letter-spacing: 2px; font-weight: 600; text-transform: uppercase; }
.quiz-scenario { font-size: 17px; line-height: 1.75; color: var(--c-text); margin-bottom: 32px; font-weight: 500; }
.quiz-options { display: flex; flex-direction: column; gap: 12px; }
.quiz-opt { background: #fff; border: var(--border-w) solid var(--c-cream2); border-radius: var(--r-md); padding: 16px 18px; font-size: 15px; color: var(--c-text); cursor: pointer; transition: all 0.2s var(--ease-soft); text-align: left; line-height: 1.65; font-weight: 500; box-shadow: var(--shadow-inner), var(--shadow-outer); position: relative; overflow: hidden; }
.quiz-opt:active { transform: scale(0.97); }
/* Option Color Themes — 4 Morandi colors */
.quiz-opt.c-y { --opt-color: var(--c-yellow); --opt-light: var(--c-yellow-light); }
.quiz-opt.c-g { --opt-color: var(--c-green); --opt-light: var(--c-green-light); }
.quiz-opt.c-b { --opt-color: var(--c-blue); --opt-light: var(--c-blue-light); }
.quiz-opt.c-p { --opt-color: var(--c-pink); --opt-light: var(--c-pink-light); }
.quiz-opt:hover { border-color: var(--opt-color, var(--c-yellow)); transform: translateY(-2px); box-shadow: var(--shadow-hover); background: var(--opt-light, var(--c-yellow-light)); }
.quiz-opt.selected { border-color: var(--opt-color, var(--c-pink)); background: var(--opt-light, var(--c-pink-light)); font-weight: 700; box-shadow: inset -3px -3px 8px rgba(0,0,0,0.06), 3px 3px 10px rgba(0,0,0,0.1); transform: scale(1.02); }
/* Quiz Navigation */
.quiz-nav { display: flex; gap: 10px; margin-top: 24px; justify-content: center; }
.quiz-nav-btn { font-family: "Varela Round","Nunito Sans","PingFang SC",sans-serif; border: var(--border-w) solid var(--c-cream2); border-radius: var(--r-sm); padding: 12px 24px; font-size: 14px; cursor: pointer; font-weight: 600; transition: transform 0.2s var(--ease-bounce), box-shadow 0.2s var(--ease-soft); background: #fff; color: var(--c-text2); box-shadow: var(--shadow-inner), var(--shadow-outer); }
.quiz-nav-btn:hover { border-color: var(--c-yellow); color: var(--c-text); }
.quiz-nav-btn:active { transform: scale(0.94); }
.quiz-nav-btn:disabled { opacity: 0.35; pointer-events: none; }
.quiz-nav-btn.primary { background: linear-gradient(135deg, var(--c-yellow-light), var(--c-green-light)); border-color: var(--c-yellow); color: var(--c-text); font-weight: 700; }
.quiz-nav-btn.primary:hover { border-color: var(--c-green); }
.quiz-nav-hint { font-size: 12px; color: var(--c-text3); text-align: center; margin-top: 8px; }
/* ===== Result Screen ===== */
.result-screen { background: linear-gradient(180deg, #faf8f5 0%, #f5f0d0 12%, #faf8f5 24%, #ddf0d0 36%, #faf8f5 48%, #d0e8f5 60%, #faf8f5 72%, #f5d0e0 84%, #faf8f5 100%); }
.result-inner { max-width: 400px; width: 100%; text-align: center; padding: 48px 0 72px; }
.result-emoji { font-size: 80px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.08)); }
.result-pct { font-family: "Varela Round", "Nunito Sans", "PingFang SC", sans-serif; font-size: 64px; font-weight: 800; color: var(--c-text); line-height: 1; margin-bottom: 4px; letter-spacing: -1px; }
.result-pct-label { font-size: 14px; color: var(--c-text3); letter-spacing: 3px; margin-bottom: 24px; font-weight: 600; text-transform: uppercase; }
.result-name { font-family: "Varela Round", "Nunito Sans", "PingFang SC", sans-serif; font-size: 26px; font-weight: 700; color: var(--c-text); position: relative; display: inline-block; padding: 0 4px; }
.result-name::after { content: ""; position: absolute; bottom: -6px; left: 10%; width: 80%; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--c-yellow), var(--c-green), var(--c-blue), var(--c-pink)); }
.result-poem { font-size: 16px; color: var(--c-text2); line-height: 1.85; margin: 28px 0; font-style: italic; font-weight: 400; }
.result-divider { width: 60px; height: 2px; background: var(--c-text3); opacity: 0.2; margin: 0 auto 28px; border-radius: 1px; }
.result-psy { background: #fff; border-radius: var(--r-md); padding: 20px; margin-bottom: 24px; text-align: left; border-left: 4px solid var(--c-blue); box-shadow: var(--shadow-inner), var(--shadow-outer); border: var(--border-w) solid var(--c-blue-light); }
.result-psy-title { font-family: "Varela Round", "Nunito Sans", "PingFang SC", sans-serif; font-size: 13px; color: var(--c-blue); letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; }
.result-psy-text { font-size: 14px; color: var(--c-text2); line-height: 1.75; font-weight: 400; }
.result-note-wrap { margin-bottom: 28px; }
.result-note { display: inline-block; background: #fff; border-radius: var(--r-sm); padding: 16px 22px; font-size: 14px; color: var(--c-text); line-height: 1.65; position: relative; box-shadow: inset -2px -2px 6px rgba(232,216,138,0.15), 3px 3px 0px var(--c-yellow), 3px 3px 10px rgba(0,0,0,0.06); border: var(--border-w) solid var(--c-yellow); max-width: 290px; text-align: left; transform: rotate(-0.5deg); }
.result-note::before { content: ""; position: absolute; top: -10px; left: 28px; width: 16px; height: 16px; background: #fff; border-left: var(--border-w) solid var(--c-yellow); border-top: var(--border-w) solid var(--c-yellow); transform: rotate(45deg); }
.result-actions { display: flex; gap: 12px; margin-top: 32px; justify-content: center; flex-wrap: wrap; }
.result-btn { font-family: "Varela Round", "Nunito Sans", "PingFang SC", sans-serif; border: var(--border-w) solid; border-radius: var(--r-lg); padding: 14px 28px; font-size: 15px; cursor: pointer; font-weight: 700; transition: transform 0.2s var(--ease-bounce), box-shadow 0.2s var(--ease-soft); box-shadow: var(--shadow-inner), var(--shadow-outer); user-select: none; }
.result-btn:active { transform: scale(0.93); }
.result-btn.retry { background: linear-gradient(135deg, var(--c-pink-light), var(--c-yellow-light)); border-color: var(--c-pink); color: var(--c-text); }
.result-btn.poster { background: linear-gradient(135deg, var(--c-green-light), var(--c-blue-light)); border-color: var(--c-green); color: var(--c-text); }
/* ===== Progress Bar Themes ===== */
.quiz-progress-bar.theme-y { background: linear-gradient(90deg, var(--c-yellow-light), var(--c-yellow)); }
.quiz-progress-bar.theme-g { background: linear-gradient(90deg, var(--c-green-light), var(--c-green)); }
.quiz-progress-bar.theme-b { background: linear-gradient(90deg, var(--c-blue-light), var(--c-blue)); }
.quiz-progress-bar.theme-p { background: linear-gradient(90deg, var(--c-pink-light), var(--c-pink)); }
/* ===== Poster Modal ===== */
.poster-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(74,64,64,0.55); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.35s var(--ease-soft); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.poster-overlay.show { opacity: 1; pointer-events: auto; }
.poster-modal { background: #fff; border-radius: var(--r-lg); padding: 28px; max-width: 420px; width: 92%; max-height: 90vh; overflow-y: auto; text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,0.18); border: var(--border-w) solid var(--c-cream2); }
.poster-modal-title { font-family: "Varela Round", "Nunito Sans", "PingFang SC", sans-serif; font-size: 20px; font-weight: 700; color: var(--c-text); margin-bottom: 16px; }
.poster-modal canvas, .poster-modal img { width: 100%; border-radius: var(--r-md); margin-bottom: 16px; box-shadow: var(--shadow-outer); }
.poster-modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.poster-btn { font-family: "Varela Round", "Nunito Sans", "PingFang SC", sans-serif; border: var(--border-w) solid; border-radius: var(--r-sm); padding: 12px 24px; font-size: 14px; cursor: pointer; font-weight: 600; transition: transform 0.2s var(--ease-bounce); user-select: none; }
.poster-btn:active { transform: scale(0.93); }
.poster-btn-save { background: var(--c-green-light); border-color: var(--c-green); color: var(--c-text); }
.poster-btn-share { background: var(--c-blue-light); border-color: var(--c-blue); color: var(--c-text); }
.poster-btn-close { background: var(--c-cream); border-color: var(--c-cream2); color: var(--c-text2); }
.poster-saving { font-size: 13px; color: var(--c-text3); margin-top: 10px; font-weight: 500; }
</style>
</head>
<body>

<!-- Claymorphism background blobs -->
<div class="bg-blobs">
  <div class="bg-blob y"></div>
  <div class="bg-blob g"></div>
  <div class="bg-blob b"></div>
  <div class="bg-blob p"></div>
</div>

<div class="screen active" id="screen-home">
  <div class="home-inner">
    <div class="home-emoji">🌸</div>
    <div class="home-title">100%爱你老己</div>
    <div class="home-sub">5·25 = 我爱我<br>测测你的自爱指数</div>
    <button class="home-btn" onclick="startQuiz()">开始测试 ✿</button>
    <div class="home-tag">10道情景题 · 20种自爱人格</div>
  </div>
</div>

<div class="screen hidden" id="screen-quiz">
  <div class="quiz-header">
    <div class="quiz-progress"><div class="quiz-progress-bar" id="progress-bar"></div></div>
    <div class="quiz-counter" id="quiz-counter">1 / 10</div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
</div>

<div class="screen hidden" id="screen-result">
  <div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div class="result-inner" id="result-inner"></div>
  </div>
</div>

<!-- Poster Modal -->
<div class="poster-overlay" id="poster-overlay">
  <div class="poster-modal">
    <div class="poster-modal-title">✨ 你的自爱海报</div>
    <img id="poster-img" alt="结果海报" style="display:none">
    <canvas id="poster-canvas" width="750" height="1100" style="display:block"></canvas>
    <div class="poster-modal-actions">
      <button class="poster-btn poster-btn-save" onclick="savePoster()">保存图片 💾</button>
      <button class="poster-btn poster-btn-share" onclick="sharePosterImg()">分享给朋友 📤</button>
      <button class="poster-btn poster-btn-close" onclick="closePoster()">关闭</button>
    </div>
    <div class="poster-saving" id="poster-msg"></div>
  </div>
</div>

<script>
// ===== QUESTIONS: 中学生自爱场景 =====
var QUESTIONS=[
{s:"考试成绩出来了，比预想的差很多，你第一反应是？",o:["我真没用，什么都做不好","完了，回家怎么交代","有点失落，但先看看错在哪","分数不代表我的价值，下次加油"],v:[0,3,7,10]},
{s:"同桌这次又比你考得好，你心里？",o:["好烦，为什么我总是追不上","假装无所谓，其实很难受","替ta开心，也相信自己的节奏","我们不比较，各走各的路"],v:[0,3,7,10]},
{s:"老师在全班面前点名说你退步了，你？",o:["恨不得钻到地底下","脸上发烧，心里全是羞耻","有点尴尬，但会默默努力","老师的评价不等于我的全部"],v:[0,3,7,10]},
{s:"熬夜写作业写到很晚，第二天还要早起，你？",o:["觉得自己好惨，活着好累","咬牙坚持，反正习惯了","决定今晚一定要早点睡","告诉自己身体比作业重要"],v:[0,3,7,10]},
{s:"一道题想了很久还是不会做，你？",o:["好笨，这么简单都不会","烦躁地把笔扔了","先跳过去，心情好了再想","问同学问老师，不丢人"],v:[0,3,7,10]},
{s:"快中考/期末了，你的心态是？",o:["焦虑到睡不着，觉得要完了","疯狂刷题，但越刷越慌","制定计划，一步步来","尽力就好，我相信自己"],v:[0,3,7,10]},
{s:"照镜子的时候，你最常想的是？",o:["这里不好看那里也不好看","为什么别人都比我好看","还行，今天气色不错","这个人也挺可爱的"],v:[0,3,7,10]},
{s:"同学说你胖了/瘦了/长痘了，你？",o:["心里一沉，一天不开心","表面笑笑，回家偷偷照镜子","有点在意，但很快就忘了","我什么样我说了算"],v:[0,3,7,10]},
{s:"刷到朋友圈里同学精修的自拍，你？",o:["我怎么p都p不出这种效果","默默关掉，不想看了","点个赞，知道那是精修的","我不需要跟任何人比外貌"],v:[0,3,7,10]},
{s:"夏天穿短裤/短袖出门，你犹豫吗？",o:["不敢穿，太暴露缺点了","穿是可以穿，但一直不自在","有点犹豫但最后穿出去了","想穿就穿，舒服最重要"],v:[0,3,7,10]},
{s:"有人偷偷议论你的外表，被你听到了，你？",o:["心碎，想把自己藏起来","假装没听见，但记了很久","有点难过，但告诉自己不重要","我的价值不由别人的嘴决定"],v:[0,3,7,10]},
{s:"班上流行某种穿搭风格但你穿起来不合适，你？",o:["硬凑，不合群比不合适更可怕","不穿但心里有点酸","找适合自己的风格","我的风格我自己定"],v:[0,3,7,10]},
{s:"你觉得自己长得好看吗？",o:["完全不好看","大多数时候不满意","有时候觉得还行","我觉得自己挺好看的"],v:[0,3,7,10]},
{s:"课间大家都三五成群，你一个人待着，你？",o:["好尴尬，假装在忙","难过，觉得自己不受欢迎","享受独处，翻翻书听听歌","一个人待着也很自在"],v:[0,3,7,10]},
{s:"你想加入一群同学聊天，但他们聊得正嗨，你？",o:["算了，我不属于那里","在旁边站着，等他们注意到我","等一个合适的时机插话","走过去自然地加入，不纠结"],v:[0,3,7,10]},
{s:"好朋友突然跟别人玩得更好了，你？",o:["被抛弃了，好难过","心里不舒服但不敢说","有点失落，但会主动约ta","朋友不是独占的，我也交新朋友"],v:[0,3,7,10]},
{s:"有人说你太安静了不合群，你？",o:["开始强迫自己多说话","难过，觉得自己有问题","我就是比较安静怎么了","安静是我的性格，不是缺陷"],v:[0,3,7,10]},
{s:"你在班里被开了一个让你不舒服的玩笑，你？",o:["跟着笑，假装没事","心里委屈但不吭声","当时没说但事后很难受","直接说这个玩笑我不喜欢"],v:[0,3,7,10]},

function selectOpt(idx){
  state.answers[state.q]=idx;
  var opts=document.querySelectorAll(".quiz-opt");

}
function nextQ(){
  if(state.answers[state.q]===-1)return;
  state.score+=QUESTIONS[state.order[state.q]].v[state.answers[state.q]];
  state.q++;
  if(state.q<10)renderQ();else showResult();
}
function prevQ(){
  if(state.q===0)return;
  // Undo previous question's score
  if(state.answers[state.q-1]!==-1){
    state.score-=QUESTIONS[state.order[state.q-1]].v[state.answers[state.q-1]];
  }
  state.q--;

}

  var img=document.getElementById("poster-img");img.style.display="none";
  canvas.style.display="block";
  document.getElementById("poster-overlay").classList.add("show");
  document.getElementById("poster-msg").textContent="长按海报即可保存";
}
function savePoster(){
  var canvas=document.getElementById("poster-canvas");
  var link=document.createElement("a");link.download="100percent-love-yourself.png";
  link.href=canvas.toDataURL("image/png");link.click();
  document.getElementById("poster-msg").textContent="已保存！快去分享吧 ✨";
}
function sharePosterImg(){
  var canvas=document.getElementById("poster-canvas");
  canvas.toBlob(function(blob){
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([blob],"poster.png",{type:"image/png"})]})){
      navigator.share({files:[new File([blob],"poster.png",{type:"image/png"})],title:"100%爱你老己",text:"来测测你的自爱指数！"}).catch(function(){});
    }else{
      savePoster();document.getElementById("poster-msg").textContent="请长按海报保存后分享 ✨";
    }
  },"image/png");
}
function closePoster(){document.getElementById("poster-overlay").classList.remove("show");}
// ===== CANVAS HELPERS =====
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function wrapText(ctx,text,maxW){
  var words=text.split(""),lines=[],cur="";
  for(var i=0;i<words.length;i++){
    var t=cur+words[i];
    if(ctx.measureText(t).width>maxW&&cur.length>0){lines.push(cur);cur=words[i];}
    else{cur=t;}
  }
  if(cur.length>0)lines.push(cur);
  return lines;
}
function showScreen(id){var ss=document.querySelectorAll(".screen");for(var i=0;i<ss.length;i++){ss[i].classList.remove("active");ss[i].classList.add("hidden");}document.getElementById(id).classList.remove("hidden");document.getElementById(id).classList.add("active");}
